# Builds the tpu-sync-torch wheel inside the ml-build container on the
# self-hosted GCE runner (linux-x86-n2-64 / linux-x86-n2-32) with a persistent
# host-mounted Bazel cache (/var/cache/tpu-raiden-bazel) and uploads the
# resulting wheel as a workflow artifact.

name: Build Torch Wheel

on:
  push:
    branches:
      - main
      - "partner/**"
      - "wdhongtw/**"
      - "connector-*"
      - "raiden-*"
      - "ci/**"
  pull_request:
  workflow_dispatch:
    inputs:
      torch_abis:
        description: "Torch releases the torch wheel ships an extension variant for, space-separated, primary first"
        required: false
        default: "2.11.0 2.12.0 2.13.0"
        type: string
      wheel_version_extras:
        description: "Optional version suffix override (empty = .dev<UTC timestamp>)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_torch_wheel:
    name: "Build tpu-sync-torch wheel"
    runs-on: linux-x86-n2-32
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest@sha256:dddf008479144c57182b56a6d00bfc1f38f8f2ef206e2bc26ff6c0a401ded47e
      options: -v /var/cache/tpu-raiden-bazel:/bazel_cache
    timeout-minutes: 300
    steps:
      - name: Checkout tpu-sync
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          path: tpu-sync

      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/tpu-sync"

      - name: Stamp wheel version
        id: stamp
        working-directory: tpu-sync
        env:
          INPUT_EXTRAS: ${{ inputs.wheel_version_extras }}
        run: |
          BASE_VERSION=$(sed -n -E 's/^version = "(.*)"/\1/p' pyproject.toml | head -1)
          if [[ -n "${INPUT_EXTRAS}" ]]; then
            EXTRAS="${INPUT_EXTRAS}"
          else
            EXTRAS=".dev$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "wheel_version_extras=${EXTRAS}" >> "$GITHUB_OUTPUT"
          echo "version=${BASE_VERSION}${EXTRAS}" >> "$GITHUB_OUTPUT"
          echo "Building tpu-sync-torch version: ${BASE_VERSION}${EXTRAS}"

      - name: Build tpu-sync-torch wheel
        shell: bash
        working-directory: tpu-sync
        env:
          BUILD_MODE: torch
          WHEEL_VERSION_EXTRAS: ${{ steps.stamp.outputs.wheel_version_extras }}
          RAIDEN_TORCH_ABIS: ${{ inputs.torch_abis || '2.11.0 2.12.0 2.13.0' }}
          EXTRA_BAZEL_FLAGS: --output_filter=^$ --show_progress_rate_limit=5 ${{ github.repository == 'google/tpu-sync' && '--config=ci' || '' }}
        run: |
          if [[ -d /bazel_cache && -w /bazel_cache ]]; then
            export BAZEL_CACHE_DIR="/bazel_cache"
          else
            export BAZEL_CACHE_DIR="${RUNNER_TEMP}/bazel_cache"
          fi
          export BAZEL_OUTPUT_BASE="${BAZEL_CACHE_DIR}/output_base"
          bash ci/build_wheel_impl.sh

      - name: Check wheel metadata and summarize
        working-directory: tpu-sync
        env:
          WHEEL_VERSION_EXTRAS: ${{ steps.stamp.outputs.wheel_version_extras }}
        run: |
          tr -d '\r\n ' < torch_tpu.version > dist/torch_tpu_version.txt
          uv run --isolated --with twine twine check dist/*"${WHEEL_VERSION_EXTRAS}"-*.whl
          {
            echo "### Built \`tpu-sync-torch\` Wheel"
            echo "- **Commit**: \`${GITHUB_SHA}\`"
            echo "- **Paired \`torch_tpu\`**: \`$(cat dist/torch_tpu_version.txt)\`"
            echo "- **Torch ABIs**: \`${{ inputs.torch_abis || '2.11.0 2.12.0 2.13.0' }}\`"
            echo '```'
            ls -lh dist/*"${WHEEL_VERSION_EXTRAS}"-*.whl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: tpu-sync-torch-wheel-${{ steps.stamp.outputs.version }}
          path: |
            tpu-sync/dist/tpu_sync_torch-*${{ steps.stamp.outputs.wheel_version_extras }}-*.whl
            tpu-sync/dist/torch_tpu_version.txt
          if-no-files-found: error
